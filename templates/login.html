<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI PDF Chatbot</title>
    <link rel="stylesheet" href="{{url_for ('static',filename='style.css')}}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <!-- <div class="auth-logo">✳</div> -->

        <p class="auth-label">AI PDF CHATBOT</p>

        <h1>Welcome <span>Back.</span></h1>

        <p class="auth-subtitle">
            Log in to continue your AI-powered journey.
        </p>

        <div class="auth-fields">

            <div class="input-group">
                <label for="email">Email Address</label>

                <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                    <button type="button" id="togglePassword" class="toggle-password">
                        <i class="fa-solid fa-eye"></i>
                        
                    </button>
                </div>
            </div>

            <button type="button" class="auth-button">
                Login
            </button>

        </div>

        <p class="auth-footer">
            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Sign Up
            </a>
        </p>

        <a href="{{ url_for('home') }}" class="back-link">
            Back to Home
        </a>

    </div>
    <div class="background auth-background">

        <div class="green-glow"></div>
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>
    </div>
</body>
<script>

const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const icon = togglePassword.querySelector("i");

togglePassword.addEventListener("click", function () {

    const isPassword = passwordInput.type === "password";

    passwordInput.type = isPassword ? "text" : "password";

    icon.classList.toggle("fa-eye", !isPassword);
    icon.classList.toggle("fa-eye-slash", isPassword);

});
</script>

</html>
